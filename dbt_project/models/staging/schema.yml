version: 2

models:
  - name: stg_ga_sessions
    description: "One row per GA session, normalized from the DuckLake raw table."
    columns:
      - name: fullVisitorId
        description: "Visitor identifier."
        tests:
          - not_null
      - name: visitId
        description: "Visit identifier."
        tests:
          - not_null
      - name: date
        description: "Session date as YYYYMMDD string."
        tests:
          - not_null
      - name: is_conversion
        description: "Target label: session had at least one transaction."

  - name: stg_transactions
    description: "One row per converting session with its transaction fields."
    columns:
      - name: fullVisitorId
        tests: [not_null]
      - name: visitId
        tests: [not_null]
      - name: transaction_count
        description: "Number of transactions in the session."
        tests: [not_null]
      - name: transaction_revenue_micros
        description: "Revenue in micros for the session."
