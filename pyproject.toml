[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-ml-drift-poc"
version = "0.0.1"
description = "Local-first analytics-to-ML drift monitoring POC"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.3.2",
  "pandas>=2.3.2",
  "scikit-learn>=1.6.1",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dbt = [
  "dbt-core>=1.9,<1.10",
  "dbt-duckdb>=1.9,<1.10",
]
ml-serving = [
  "bentoml>=1.4.19",
]
monitoring = [
  "evidently>=0.7.11",
  "prometheus-client>=0.22.1",
]
api = [
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.9",
]
dev = [
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.13.2",
  "mypy>=1.18.2",
  "httpx>=0.27.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
