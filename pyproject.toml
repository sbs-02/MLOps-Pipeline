[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-ml-drift-poc"
version = "0.0.1"
description = "Local-first analytics-to-ML drift monitoring POC"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==1.5.6",
  "pandas==3.0.6",
  "numpy==2.5.4",
  "pyarrow==26.0.0",
  "pyiceberg[sql-sqlite]==0.12.0",
  "google-cloud-bigquery==3.46.1",
  "scikit-learn==1.9.1",
  "pyyaml==6.0.3",
  "ipykernel==7.4.0",
  "pydantic==2.14.1",
]

[project.optional-dependencies]
dbt = [
  "dbt-core==1.12.6",
  "dbt-duckdb==1.11.0",
]
ml-serving = [
  "bentoml==1.4.40",
]
monitoring = [
  "evidently==0.7.23",
  "prometheus-client==0.26.0",
]
api = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
